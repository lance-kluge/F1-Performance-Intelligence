[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "f1-performance-intelligence"
version = "0.1.0"
description = "A typed, local-first Formula 1 performance data platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "F1 Performance Intelligence contributors" }]
dependencies = [
  "fastf1>=3.8.3,<3.9",
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<3",
  "pandera[pandas]>=0.32,<0.33",
  "pyarrow>=18,<24",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.60,<2",
]
dev = [
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/f1pi"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not live' --cov=f1pi --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
markers = ["live: exercises the live FastF1 upstream and local cache"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["f1pi"]
mypy_path = "src"
plugins = ["pandera.mypy"]

[[tool.mypy.overrides]]
module = ["fastf1.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["f1pi"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
